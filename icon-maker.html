<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>OddsNotLuck icon maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,800&display=block" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#120E1E;--card:#1C1630;--bd:#2F2550;--tx:#EEEAF7;--mut:#9A90B5;--ac:#A66BFF;--no:#FF7A66;--ok:#3DDC97;--cd:"Barlow Condensed","Arial Narrow",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:28px 18px 60px}
h1{font:italic 800 32px/1 var(--cd);margin:0 0 6px}
p{color:var(--mut);margin:0 0 14px}
.mk{width:84px;height:84px;border-radius:22px;background:#1A1430;box-shadow:0 0 0 2px #A66BFF;display:flex;align-items:center;justify-content:center;font:italic 800 50px/1 var(--cd);color:#A66BFF;letter-spacing:-.6px}
.row{display:flex;gap:18px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:12px 0}
.row canvas{width:84px;height:84px;border-radius:19px}
.lbl{font-size:12.5px;color:var(--mut);text-align:center;margin-top:6px}
button{background:var(--ac);color:#120E1E;border:0;border-radius:10px;padding:12px 16px;font-weight:700;font-size:15px;cursor:pointer;width:100%;margin-top:8px}
button.s{background:none;color:var(--ac);border:1px solid var(--ac)}
#st{font-weight:600;margin:10px 0}
#st.ok{color:var(--ok)}#st.no{color:var(--no)}
</style>
</head>
<body>
<main>
  <h1>Icon maker</h1>
  <p>Draws the home-screen icons with the same Barlow Condensed font as the logo in the app, so they always match.</p>
  <div id="st">Loading the logo font…</div>
  <div class="row">
    <div><div class="mk">21</div><div class="lbl">In the app</div></div>
    <div><canvas id="pv" width="512" height="512"></canvas><div class="lbl">Home-screen icon</div></div>
  </div>
  <button data-f="apple-touch-icon.png" data-s="180">Download apple-touch-icon.png</button>
  <button data-f="icon-192.png" data-s="192">Download icon-192.png</button>
  <button data-f="icon-512.png" data-s="512">Download icon-512.png</button>
  <button data-f="icon.svg" data-s="svg" class="s">Download icon.svg (browser tab icon)</button>
</main>
<script>
var FONT='"Barlow Condensed"';
function draw(c,n){
  var x=c.getContext("2d");c.width=n;c.height=n;
  x.fillStyle="#1A1430";x.fillRect(0,0,n,n);
  // purple outline, following the rounded shape the phone cuts the icon to
  var w=Math.max(2,n/42),r=n*0.2237,i=w/2;
  x.strokeStyle="#A66BFF";x.lineWidth=w;x.beginPath();
  if(x.roundRect)x.roundRect(i,i,n-w,n-w,r-i);else x.rect(i,i,n-w,n-w);
  x.stroke();
  // "21" at the same size as the logo tile (25px font in a 42px tile)
  x.fillStyle="#A66BFF";x.font="italic 800 "+Math.round(n*25/42)+"px "+FONT+",'Arial Narrow',sans-serif";
  x.textAlign="left";x.textBaseline="alphabetic";
  var m=x.measureText("21"),gw=m.actualBoundingBoxLeft+m.actualBoundingBoxRight,gh=m.actualBoundingBoxAscent+m.actualBoundingBoxDescent;
  x.fillText("21",(n-gw)/2+m.actualBoundingBoxLeft,(n-gh)/2+m.actualBoundingBoxAscent);
  return c;
}
function save(blob,name){var u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000)}
var ready=false;
document.fonts.load("italic 800 100px "+FONT).then(function(){
  ready=Array.from(document.fonts).some(function(f){return f.family.replace(/["']/g,"")==="Barlow Condensed"&&f.style==="italic"&&f.status==="loaded"});
  draw(document.getElementById("pv"),512);
  var st=document.getElementById("st");
  if(ready){st.textContent="Logo font loaded. The icon matches the app.";st.className="ok"}
  else{st.textContent="The logo font didn\u2019t load, so these won\u2019t match. Check your connection and reload.";st.className="no"}
});
document.addEventListener("click",function(e){
  var b=e.target.closest("button[data-f]");if(!b)return;
  if(!ready){alert("Wait until the logo font has loaded.");return}
  if(b.dataset.s==="svg"){
    var png=draw(document.createElement("canvas"),256).toDataURL("image/png");
    save(new Blob(['<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 64 64"><image width="64" height="64" href="'+png+'" xlink:href="'+png+'"/></svg>'],{type:"image/svg+xml"}),"icon.svg");
    return}
  draw(document.createElement("canvas"),+b.dataset.s).toBlob(function(bl){save(bl,b.dataset.f)},"image/png");
});
</script>
</body>
</html>
